<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf6" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
  <!-- Canonical domain: swap this when the real domain goes live (Cloudflare move).
       Per-route canonicals are set at runtime from the current origin. -->
  <link rel="canonical" href="https://karriere.freebuff.app/" />
  <meta property="og:site_name" content="Karriere" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Karriere — The unfiltered career file" />
  <meta property="og:description" content="Honest career guidance for Indian students. Real salaries, real timelines, real regrets — from people who lived each path." />
  <meta property="og:image" content="https://karriere.freebuff.app/og/default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://karriere.freebuff.app/og/default.png" />
  <title>Karriere — The unfiltered career file</title>
  <meta name="description" content="Honest career guidance for Indian students. Real salaries, real timelines, real regrets — from people who lived each path. No brochures, no fluff." />
  <script>
    // Apply theme before first paint — dark-first, like Vercel
    (function () {
      try {
        var stored = localStorage.getItem("karriere-theme");
        var dark = stored ? stored === "dark" : true;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
